<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Graph Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .logs-panel {
            width: 50%;
            background: #0f0f1a;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
        }

        .chat-panel {
            width: 50%;
            display: flex;
            flex-direction: column;
            background: #16213e;
        }

        .panel-header {
            padding: 16px 20px;
            background: #0a0a14;
            border-bottom: 1px solid #333;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
        }

        .logs-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .logs-content .log-line {
            margin-bottom: 2px;
        }

        .logs-content .step {
            color: #4fc3f7;
            font-weight: bold;
        }

        .logs-content .success {
            color: #81c784;
        }

        .logs-content .error {
            color: #e57373;
        }

        .logs-content .info {
            color: #fff176;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
        }

        .message.user {
            align-self: flex-end;
            background: #4a5568;
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            align-self: flex-start;
            background: #2d3748;
            border-bottom-left-radius: 4px;
        }

        .message.bot .response-text {
            color: #68d391;
            font-weight: 500;
        }

        .chat-input-container {
            padding: 16px 20px;
            background: #0a0a14;
            border-top: 1px solid #333;
        }

        .chat-input-wrapper {
            display: flex;
            gap: 12px;
        }

        #chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #1a1a2e;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        #chat-input:focus {
            border-color: #4fc3f7;
        }

        #send-btn {
            padding: 12px 24px;
            background: #4fc3f7;
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        #send-btn:hover {
            background: #29b6f6;
        }

        #send-btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }

        .status-bar {
            padding: 8px 20px;
            background: #0a0a14;
            border-top: 1px solid #222;
            font-size: 12px;
            color: #666;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e57373;
        }

        .status-dot.connected {
            background: #81c784;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a14;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #444;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .logs-panel {
                width: 100%;
                height: 40%;
                border-right: none;
                border-bottom: 1px solid #333;
            }

            .chat-panel {
                width: 100%;
                height: 60%;
            }

            .panel-header {
                padding: 12px 16px;
                font-size: 12px;
            }

            .logs-content {
                font-size: 11px;
                padding: 12px;
            }

            .chat-messages {
                padding: 12px;
                gap: 12px;
            }

            .message {
                max-width: 90%;
                padding: 10px 14px;
                font-size: 14px;
            }

            .chat-input-container {
                padding: 12px;
            }

            #chat-input {
                padding: 10px 14px;
                font-size: 16px;
            }

            #send-btn {
                padding: 10px 16px;
            }

            .status-bar {
                padding: 6px 12px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logs-panel">
            <div class="panel-header">Terminal Logs</div>
            <div class="logs-content" id="logs"></div>
            <div class="status-bar">
                <div class="status-dot" id="status-dot"></div>
                <span id="status-text">Disconnected</span>
            </div>
        </div>
        <div class="chat-panel">
            <div class="panel-header">Knowledge Graph Chat</div>
            <div class="chat-messages" id="messages"></div>
            <div class="chat-input-container">
                <div class="chat-input-wrapper">
                    <input type="text" id="chat-input" placeholder="Type your message..." autocomplete="off">
                    <button id="send-btn" disabled>Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const logsContainer = document.getElementById('logs');
        const messagesContainer = document.getElementById('messages');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');

        let ws = null;

        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

            ws.onopen = () => {
                statusDot.classList.add('connected');
                statusText.textContent = 'Connected';
                sendBtn.disabled = false;
                addLog('System connected. Ready to chat!', 'success');
            };

            ws.onclose = () => {
                statusDot.classList.remove('connected');
                statusText.textContent = 'Disconnected';
                sendBtn.disabled = true;
                addLog('Connection lost. Reconnecting...', 'error');
                setTimeout(connect, 2000);
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.type === 'log') {
                    addLog(data.content);
                } else if (data.type === 'response') {
                    addMessage(data.content, 'bot');
                }
            };
        }

        function addLog(content, type = '') {
            const logLine = document.createElement('div');
            logLine.className = 'log-line';
            
            if (content.includes('STEP')) {
                logLine.classList.add('step');
            } else if (type === 'success' || content.includes('✓')) {
                logLine.classList.add('success');
            } else if (type === 'error' || content.includes('✗')) {
                logLine.classList.add('error');
            } else if (content.includes('→')) {
                logLine.classList.add('info');
            }
            
            logLine.textContent = content;
            logsContainer.appendChild(logLine);
            logsContainer.scrollTop = logsContainer.scrollHeight;
        }

        function addMessage(content, sender) {
            const message = document.createElement('div');
            message.className = `message ${sender}`;
            
            if (sender === 'bot') {
                message.innerHTML = `<span class="response-text">${escapeHtml(content)}</span>`;
            } else {
                message.textContent = content;
            }
            
            messagesContainer.appendChild(message);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function sendMessage() {
            const message = chatInput.value.trim();
            if (!message || !ws || ws.readyState !== WebSocket.OPEN) return;

            addMessage(message, 'user');
            ws.send(JSON.stringify({ type: 'message', content: message }));
            chatInput.value = '';
        }

        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        connect();
    </script>
</body>
</html>
